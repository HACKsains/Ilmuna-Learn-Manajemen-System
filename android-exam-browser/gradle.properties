# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.suppressUnsupportedCompileSdk=37

# AGP Warnings & Sync Issues Suppression
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.sync.suppressAgpWarnings=LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED,UNSUPPORTED_PROJECT_OPTION_USE
